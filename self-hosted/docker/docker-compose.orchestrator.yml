name: convex-orchestrator

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    stop_grace_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-better-auth.sql:/docker-entrypoint-initdb.d/00-better-auth.sql:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-orchestrator}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-orchestrator}
      - POSTGRES_DB=${POSTGRES_DB:-orchestrator}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-orchestrator} -d
          $${POSTGRES_DB:-orchestrator}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  orchestrator:
    image: ${ORCHESTRATOR_IMAGE:-ghcr.io/defy-works/convex-orchestrator:latest}
    restart: unless-stopped
    stop_grace_period: 10s
    # Long-lived dashboard WebSockets + per-deployment proxy connections
    # blow through the default 1024 fd cap quickly. Pin a generous limit
    # so the orchestrator doesn't `accept()` into `Too many open files`.
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${ORCHESTRATOR_PORT:-8050}:8050"
      - "${BIND_ADDR:-127.0.0.1}:${ROUTER_PORT:-9000}:9000"
    volumes:
      - orchestrator-data:/convex/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Custom-domain routers are rendered here and read by Traefik's file
      # provider. Written by the orchestrator, read-only on the Traefik side.
      - traefik-dynamic:/convex/traefik-dynamic
    labels:
      - "traefik.enable=true"
      # Orchestrator API on ORCHESTRATOR_HOST. Priority above the
      # wildcard router below so api.${ROUTER_HOST} reaches :8050 even
      # when ORCHESTRATOR_HOST happens to be a subdomain of ROUTER_HOST.
      - "traefik.http.routers.orchestrator-api.rule=Host(`${ORCHESTRATOR_HOST:-orchestrator-host-not-set.invalid}`)"
      - "traefik.http.routers.orchestrator-api.priority=100"
      - "traefik.http.routers.orchestrator-api.entrypoints=websecure"
      - "traefik.http.routers.orchestrator-api.tls.certresolver=le"
      - "traefik.http.routers.orchestrator-api.service=orchestrator-api"
      - "traefik.http.services.orchestrator-api.loadbalancer.server.port=8050"
      # Fallback route for spawned-deployment subdomains. New backend
      # containers normally get exact Host() Traefik labels and bypass this
      # in-orchestrator proxy, but the wildcard route still covers legacy or
      # unlabeled containers. The wildcard cert (main + *.ROUTER_HOST SANs)
      # covers any number of deployments.
      - "traefik.http.routers.orchestrator-router.rule=HostRegexp(`.+\\.${ROUTER_HOST:-router-host-not-set.invalid}$$`)"
      - "traefik.http.routers.orchestrator-router.priority=1"
      - "traefik.http.routers.orchestrator-router.entrypoints=websecure"
      - "traefik.http.routers.orchestrator-router.tls.certresolver=le"
      - "traefik.http.routers.orchestrator-router.tls.domains[0].main=${ROUTER_HOST:-router-host-not-set.invalid}"
      - "traefik.http.routers.orchestrator-router.tls.domains[0].sans=*.${ROUTER_HOST:-router-host-not-set.invalid}"
      - "traefik.http.routers.orchestrator-router.service=orchestrator-router"
      - "traefik.http.services.orchestrator-router.loadbalancer.server.port=9000"
    environment:
      - CONVEX_ORCHESTRATOR_DATABASE_URL=${CONVEX_ORCHESTRATOR_DATABASE_URL:-postgres://${POSTGRES_USER:-orchestrator}:${POSTGRES_PASSWORD:-orchestrator}@postgres:5432/${POSTGRES_DB:-orchestrator}}
      - CONVEX_ORCHESTRATOR_PROVISION_ADDR=${CONVEX_ORCHESTRATOR_PROVISION_ADDR:-0.0.0.0:8050}
      - CONVEX_ORCHESTRATOR_ROUTER_ADDR=${CONVEX_ORCHESTRATOR_ROUTER_ADDR:-0.0.0.0:9000}
      # Auto-derives to https://${DASHBOARD_HOST} when set, else
      # falls back to http://localhost. Explicit PUBLIC_ORIGIN overrides.
      - CONVEX_ORCHESTRATOR_PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-${DASHBOARD_HOST:+https://}${DASHBOARD_HOST:-http://localhost}}
      - CONVEX_ORCHESTRATOR_ROUTER_HOST=${ROUTER_HOST:-localhost}
      - CONVEX_ORCHESTRATOR_ROUTER_PUBLIC_PORT=${ROUTER_PUBLIC_PORT:-${ROUTER_PORT:-9000}}
      # Scheme of the deployment URLs the orchestrator advertises.
      # Default `http` for raw-port local dev. Set to `https` (or pass
      # ROUTER_PUBLIC_PORT=443) when TLS terminates in front of the
      # orchestrator (Traefik) — otherwise the dashboard's WebSocket
      # subscription hits a mixed-content block.
      - CONVEX_ORCHESTRATOR_ROUTER_PUBLIC_SCHEME=${ROUTER_PUBLIC_SCHEME:-http}
      # When Traefik is enabled, route deployment hosts straight to their
      # backend containers. The orchestrator proxy remains as a fallback
      # wildcard for unlabeled or legacy containers.
      - CONVEX_ORCHESTRATOR_DIRECT_BACKEND_ROUTING=${DIRECT_BACKEND_ROUTING:-true}
      - CONVEX_ORCHESTRATOR_PROVISIONER=${PROVISIONER:-docker}
      - CONVEX_ORCHESTRATOR_BACKEND_IMAGE=${BACKEND_IMAGE:-ghcr.io/defy-works/convex-backend:latest}
      - CONVEX_ORCHESTRATOR_BACKEND_CONTAINER_PREFIX=${BACKEND_CONTAINER_PREFIX:-convex-orchestrator-deployment-}
      - CONVEX_ORCHESTRATOR_BACKEND_NETWORK=${BACKEND_NETWORK:-convex-orchestrator_default}
      - CONVEX_ORCHESTRATOR_DATA_ROOT=${CONVEX_ORCHESTRATOR_DATA_ROOT:-/convex/data}
      - CONVEX_ORCHESTRATOR_BOOTSTRAP_TOKEN=${BOOTSTRAP_TOKEN:-orchestrator-bootstrap-token-change-me}
      - CONVEX_ORCHESTRATOR_SERVICE_KEY=${SERVICE_KEY:-orchestrator-service-key-change-me}
      - CONVEX_ORCHESTRATOR_DEFAULT_TEAM_NAME=${DEFAULT_TEAM_NAME:-Self-Hosted}
      - CONVEX_ORCHESTRATOR_ADMIN_EMAILS=${ADMIN_EMAILS:-admin@example.com}
      - CONVEX_ORCHESTRATOR_REGISTRATION=${REGISTRATION_MODE:-allowlist}
      # Custom domains. Routers and certificates for domains added through
      # the dashboard are rendered into this directory (Traefik's file
      # provider watches it), because docker labels are fixed when a backend
      # container is created and can't pick up a domain added later. Unset
      # the directory to turn the feature off — the dashboard then reports it
      # as unavailable rather than recording domains that would never route.
      - CONVEX_ORCHESTRATOR_TRAEFIK_DYNAMIC_DIR=${TRAEFIK_DYNAMIC_DIR:-/convex/traefik-dynamic}
      # Path the same volume is mounted at inside the Traefik container, used
      # when writing certFile/keyFile paths Traefik has to resolve.
      - CONVEX_ORCHESTRATOR_TRAEFIK_CERT_DIR=${TRAEFIK_CERT_DIR:-/dynamic}
      # How Traefik reaches this service to forward ACME HTTP-01 challenges.
      - CONVEX_ORCHESTRATOR_UPSTREAM=${CONVEX_ORCHESTRATOR_UPSTREAM:-orchestrator:8050}
      # Registered with Let's Encrypt for expiry warnings. Falls back to the
      # same address the wildcard cert uses.
      - CONVEX_ORCHESTRATOR_ACME_CONTACT_EMAIL=${ACME_CONTACT_EMAIL:-${LETSENCRYPT_EMAIL:-}}
      # Point at the LE staging directory to exercise issuance without
      # burning production rate limit.
      - CONVEX_ORCHESTRATOR_ACME_DIRECTORY_URL=${ACME_DIRECTORY_URL:-}
      - RUST_LOG=${RUST_LOG:-orchestrator=info,tower_http=warn}
    healthcheck:
      test: curl -fsS http://localhost:8050/health || exit 1
      interval: 5s
      start_period: 30s
      retries: 10

  dashboard-orchestrator:
    image: ${DASHBOARD_ORCHESTRATOR_IMAGE:-ghcr.io/defy-works/convex-dashboard-orchestrator:latest}
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      orchestrator:
        condition: service_started
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${DASHBOARD_ORCHESTRATOR_PORT:-6793}:6793"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${DASHBOARD_HOST:-dashboard-host-not-set.invalid}`)"
      - "traefik.http.routers.dashboard.priority=100"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=le"
      - "traefik.http.services.dashboard.loadbalancer.server.port=6793"
    environment:
      # URLs the browser hits. When *_HOST is set, derive
      # https://${HOST}; otherwise fall back to localhost:port for
      # local dev. PUBLIC_*_URL overrides take precedence for operators
      # who want non-https schemes or explicit port-suffixed URLs.
      - PUBLIC_ORCHESTRATOR_URL=${PUBLIC_ORCHESTRATOR_URL:-${ORCHESTRATOR_HOST:+https://}${ORCHESTRATOR_HOST:-http://localhost:${ORCHESTRATOR_PORT:-8050}}}
      - PUBLIC_ORCHESTRATOR_REGION_NAME=${PUBLIC_ORCHESTRATOR_REGION_NAME:-${ORCHESTRATOR_REGION_NAME:-Self-Hosted}}
      - BETTER_AUTH_DATABASE_URL=${BETTER_AUTH_DATABASE_URL:-postgres://${POSTGRES_USER:-orchestrator}:${POSTGRES_PASSWORD:-orchestrator}@postgres:5432/${POSTGRES_DB:-orchestrator}}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-${PUBLIC_DASHBOARD_URL:-${DASHBOARD_HOST:+https://}${DASHBOARD_HOST:-http://localhost:${DASHBOARD_ORCHESTRATOR_PORT:-6793}}}}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-better-auth-secret-change-me}
      - BETTER_AUTH_REQUIRE_EMAIL_VERIFICATION=${BETTER_AUTH_REQUIRE_EMAIL_VERIFICATION:-0}
      - BETTER_AUTH_SMTP_URL=${BETTER_AUTH_SMTP_URL:-}
      - BETTER_AUTH_SMTP_FROM=${BETTER_AUTH_SMTP_FROM:-no-reply@orchestrator}
      - CONVEX_ORCHESTRATOR_SERVICE_KEY=${SERVICE_KEY:-orchestrator-service-key-change-me}
      - CONVEX_ORCHESTRATOR_URL=${CONVEX_ORCHESTRATOR_INTERNAL_URL:-http://orchestrator:8050}

  dashboard-self-hosted:
    image: ${DASHBOARD_IMAGE:-ghcr.io/defy-works/convex-dashboard:latest}
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${DASHBOARD_SELF_HOSTED_PORT:-6791}:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${NEXT_PUBLIC_DEPLOYMENT_URL:-}
      - NEXT_PUBLIC_LOAD_MONACO_INTERNALLY=${NEXT_PUBLIC_LOAD_MONACO_INTERNALLY:-true}
      - TRUSTED_PARENT_ORIGINS=${TRUSTED_PARENT_ORIGINS:-${PUBLIC_DASHBOARD_URL:-${DASHBOARD_HOST:+https://}${DASHBOARD_HOST:-http://localhost:${DASHBOARD_ORCHESTRATOR_PORT:-6793}}}}

  # TLS terminator. Opt-in via `docker compose --profile tls up -d`.
  # Auto-issues a wildcard Let's Encrypt cert (DNS-01) for the spawned-
  # deployment subdomains, plus individual certs for the dashboard and
  # orchestrator API hosts. Provider defaults to Cloudflare; for others
  # set DNS_PROVIDER and the matching env vars (see traefik docs).
  traefik:
    image: traefik:v3
    profiles: [tls]
    restart: unless-stopped
    stop_grace_period: 10s
    # Traefik fronts every browser connection, then opens upstream sockets
    # to the dashboard, orchestrator API, or directly labeled backends.
    # Keep a generous fd ceiling so Traefik isn't the choke point.
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik-acme:/acme
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Custom-domain routers written by the orchestrator. Read-only here:
      # the orchestrator owns the file, Traefik only watches it.
      - traefik-dynamic:/dynamic:ro
    environment:
      # DNS provider creds — pass through whichever ones your provider
      # needs. See https://doc.traefik.io/traefik/https/acme/#providers
      # for the full list. Common providers:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-}
      - DO_AUTH_TOKEN=${DO_AUTH_TOKEN:-}
      - GANDIV5_API_KEY=${GANDIV5_API_KEY:-}
      - HETZNER_API_KEY=${HETZNER_API_KEY:-}
      - NAMECHEAP_API_USER=${NAMECHEAP_API_USER:-}
      - NAMECHEAP_API_KEY=${NAMECHEAP_API_KEY:-}
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # File provider for custom domains. The orchestrator rewrites
      # /dynamic/conf/custom-domains.yml whenever a domain is added, removed,
      # or issued a certificate; Traefik hot-reloads it, so no restart is
      # needed. Points at `conf/` and not the volume root on purpose: the
      # provider parses every file in this directory, and the certificate
      # PEMs live in the sibling `certs/` directory.
      - "--providers.file.directory=/dynamic/conf"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL:-LETSENCRYPT_EMAIL_NOT_SET}"
      - "--certificatesresolvers.le.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.le.acme.dnschallenge=true"
      - "--certificatesresolvers.le.acme.dnschallenge.provider=${DNS_PROVIDER:-cloudflare}"
      # Pin lego's zone-discovery resolver to a public recursor. The
      # default (whatever resolv.conf in the container points at) often
      # returns SERVFAIL for SOA queries on apex domains, which makes
      # lego walk up to the TLD and fail with "could not find zone".
      - "--certificatesresolvers.le.acme.dnschallenge.resolvers=${DNS_RESOLVERS:-1.1.1.1:53,8.8.8.8:53}"
      # Second resolver for customer-supplied custom domains. These live in
      # DNS zones we don't control, so the DNS-01 challenge `le` uses can't
      # work — HTTP-01 proves control by serving a token over :80 on the
      # domain itself. The global web->websecure redirect does not interfere:
      # Traefik answers ACME challenges on an internal router that takes
      # precedence over the redirection.

volumes:
  pgdata:
  orchestrator-data:
  traefik-acme:
  traefik-dynamic:
