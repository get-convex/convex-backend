name: Sync Upstream Fork

on:
  workflow_dispatch:
    inputs:
      sync_enhanced:
        description: "Sync enhanced from upstream/main"
        type: boolean
        default: true
      sync_release:
        description: "Sync release from upstream"
        type: boolean
        default: true
  schedule:
    - cron: "17 * * * *"

env:
  UPSTREAM_REPOSITORY:
    ${{ vars.UPSTREAM_REPOSITORY != '' && vars.UPSTREAM_REPOSITORY ||
    'get-convex/convex-backend' }}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync_enhanced:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.sync_enhanced }}
    runs-on: ubuntu-latest
    steps:
      - name: Require sync token
        env:
          UPSTREAM_SYNC_PAT: ${{ secrets.UPSTREAM_SYNC_PAT }}
        run: |
          if [ -z "$UPSTREAM_SYNC_PAT" ]; then
            echo "Missing required secret: UPSTREAM_SYNC_PAT"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name "convex-upstream-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Drives the `merge=theirs` attribute declared in .gitattributes —
          # for generated/lock files we always want upstream's version.
          git config merge.theirs.name "always take theirs"
          git config merge.theirs.driver "cp -f %B %A"

      - name: Install Rust toolchain
        # Sync script reconciles Cargo.lock with our workspace after the
        # `merge=theirs` driver takes upstream's lockfile — needs cargo.
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Setup Node
        # Sync script reconciles Rush's generated pnpm-lock.yaml after
        # upstream merges so fork-local packages stay installable.
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync enhanced
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TARGET_BRANCH: enhanced
          UPSTREAM_BRANCH: main
        run: ./.github/workflows/scripts/sync-upstream-branch.sh

  sync_release:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.sync_release }}
    runs-on: ubuntu-latest
    steps:
      - name: Require sync token
        env:
          UPSTREAM_SYNC_PAT: ${{ secrets.UPSTREAM_SYNC_PAT }}
        run: |
          if [ -z "$UPSTREAM_SYNC_PAT" ]; then
            echo "Missing required secret: UPSTREAM_SYNC_PAT"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name "convex-upstream-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.theirs.name "always take theirs"
          git config merge.theirs.driver "cp -f %B %A"

      - name: Install Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync release
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TARGET_BRANCH: release
          UPSTREAM_BRANCH: release
        run: ./.github/workflows/scripts/sync-upstream-branch.sh
