name: Sync Upstream Fork

on:
  workflow_dispatch:
    inputs:
      sync_enhanced:
        description: "Sync enhanced from upstream/main"
        type: boolean
        default: true
      sync_release:
        description: "Sync release from upstream"
        type: boolean
        default: true
  schedule:
    - cron: "17 * * * *"

env:
  UPSTREAM_REPOSITORY:
    ${{ vars.UPSTREAM_REPOSITORY != '' && vars.UPSTREAM_REPOSITORY ||
    'get-convex/convex-backend' }}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync_enhanced:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.sync_enhanced }}
    # The sync script compile-gates the merged tree (cargo check --workspace,
    # dashboard builds) before pushing, so it needs the same runner class and
    # caches as the Build workflow to finish in minutes rather than an hour.
    runs-on: "runs-on=${{ github.run_id }}/runner=xlarge-x64"
    steps:
      - name: Require sync token
        env:
          UPSTREAM_SYNC_PAT: ${{ secrets.UPSTREAM_SYNC_PAT }}
        run: |
          if [ -z "$UPSTREAM_SYNC_PAT" ]; then
            echo "Missing required secret: UPSTREAM_SYNC_PAT"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name "convex-upstream-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Drives the `merge=theirs` attribute declared in .gitattributes —
          # for generated/lock files we always want upstream's version.
          git config merge.theirs.name "always take theirs"
          git config merge.theirs.driver "cp -f %B %A"

      - name: Setup Rust
        # Toolchain + system deps + sccache for the pre-push
        # `cargo check --workspace` gate and Cargo.lock reconciliation.
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          r2-access-key: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          runs-on-s3-bucket: ${{ vars.RUNS_ON_S3_BUCKET_CACHE }}
          runs-on-aws-region: ${{ vars.AWS_REGION }}

      - name: Restore pnpm artifacts
        uses: runs-on/cache/restore@bd330c5a5f6cbb837823ee25864f3c71a211c2e3 # v5.0.5
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RUNS_ON_S3_BUCKET_CACHE: ${{ vars.RUNS_ON_S3_BUCKET_CACHE }}
        with:
          path: |
            ~/.local/share/pnpm/store
            npm-packages/.turbo/cache
          key: pnpm-cache-${{ hashFiles('npm-packages/pnpm-lock.yaml') }}-3
          restore-keys: pnpm-cache-

      - name: Install mise tools
        # protoc and friends for the workspace build scripts.
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: NPM install globals
        # dprint (pinned in scripts/package.json) for the sync validation gate.
        run: npm ci --prefix scripts

      - name: Sync enhanced
        env:
          # Must be the PAT, not github.token: this repo has "Allow GitHub
          # Actions to create and approve pull requests" disabled, so the
          # default token cannot open the hand-off PR the script falls back to.
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_PAT }}
          TARGET_BRANCH: enhanced
          UPSTREAM_BRANCH: main
        run: ./.github/workflows/scripts/sync-upstream-branch.sh

  sync_release:
    # Run after sync_enhanced so the two jobs' validation builds don't compete.
    # !cancelled() lets this run even when sync_enhanced was skipped by the
    # dispatch input or failed (its failure parks in a PR, not a broken push).
    if:
      ${{ !cancelled() && (github.event_name != 'workflow_dispatch' ||
      inputs.sync_release) }}
    needs: [sync_enhanced]
    runs-on: "runs-on=${{ github.run_id }}/runner=xlarge-x64"
    steps:
      - name: Require sync token
        env:
          UPSTREAM_SYNC_PAT: ${{ secrets.UPSTREAM_SYNC_PAT }}
        run: |
          if [ -z "$UPSTREAM_SYNC_PAT" ]; then
            echo "Missing required secret: UPSTREAM_SYNC_PAT"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name "convex-upstream-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.theirs.name "always take theirs"
          git config merge.theirs.driver "cp -f %B %A"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          r2-access-key: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          runs-on-s3-bucket: ${{ vars.RUNS_ON_S3_BUCKET_CACHE }}
          runs-on-aws-region: ${{ vars.AWS_REGION }}

      - name: Restore pnpm artifacts
        uses: runs-on/cache/restore@bd330c5a5f6cbb837823ee25864f3c71a211c2e3 # v5.0.5
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RUNS_ON_S3_BUCKET_CACHE: ${{ vars.RUNS_ON_S3_BUCKET_CACHE }}
        with:
          path: |
            ~/.local/share/pnpm/store
            npm-packages/.turbo/cache
          key: pnpm-cache-${{ hashFiles('npm-packages/pnpm-lock.yaml') }}-3
          restore-keys: pnpm-cache-

      - name: Install mise tools
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: NPM install globals
        run: npm ci --prefix scripts

      - name: Sync release
        env:
          # See the note on the enhanced job: the default token cannot open
          # the hand-off PR.
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_PAT }}
          TARGET_BRANCH: release
          UPSTREAM_BRANCH: release
        run: ./.github/workflows/scripts/sync-upstream-branch.sh
